# Local Postgres for development and the server integration suite.
#   docker compose up -d postgres
#   DATABASE_URL=postgresql://blink:blink_dev_password@localhost:5432/blink_dev
#   TEST_DATABASE_URL=postgresql://blink:blink_dev_password@localhost:5432/blink_test
# (blink_test is created on demand by the integration suite's global setup.)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: blink_dev
      POSTGRES_USER: blink
      POSTGRES_PASSWORD: blink_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blink -d blink_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-checks:
    name: Server Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blink-server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: blink-server/node_modules
          key: server-node-modules-${{ hashFiles('blink-server/package-lock.json') }}
          restore-keys: |
            server-node-modules-

      - name: Install dependencies
        run: npm ci --registry https://registry.npmjs.org

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  server-integration:
    name: Server Integration (Postgres)
    runs-on: ubuntu-latest
    # Jest runs without --forceExit so leaked handles surface; cap a hang.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: blink-server

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blink
          POSTGRES_PASSWORD: blink_ci_password
          POSTGRES_DB: blink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blink -d blink_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://blink:blink_ci_password@localhost:5432/blink_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: blink-server/node_modules
          key: server-node-modules-${{ hashFiles('blink-server/package-lock.json') }}
          restore-keys: |
            server-node-modules-

      - name: Install dependencies
        run: npm ci --registry https://registry.npmjs.org

      - name: Integration tests
        run: npm run test:integration

  app-checks:
    name: App Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blink-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: blink-app/node_modules
          key: app-node-modules-${{ hashFiles('blink-app/package-lock.json') }}
          restore-keys: |
            app-node-modules-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --registry https://registry.npmjs.org

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  contract-checks:
    name: Contract Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The photo-flow protocol is duplicated in server and app; an API
      # contract change must update both copies in the same PR.
      - name: photoProtocol.ts copies are identical
        run: cmp blink-server/src/shared/photoProtocol.ts blink-app/shared/photoProtocol.ts

      # Removed for good in recovery Stage 1 (server and app): server-stored
      # photos, the TESTING_MODE login bypass and the AI SDK must not come back.
      # blink.app is a third party's domain: links and emails must never use it.
      - name: No forbidden patterns
        run: |
          if git grep -nE 'photo_url|TESTING_MODE|@anthropic-ai|blink\.app' -- blink-server blink-app legal ':!*/package-lock.json'; then
            echo 'Forbidden pattern found (photo_url, TESTING_MODE, @anthropic-ai or blink.app).'
            exit 1
          fi

name: EAS Build & Submit iOS

on:
  workflow_dispatch:

jobs:
  build:
    name: Build and Submit to TestFlight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blink-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --registry https://registry.npmjs.org

      - name: Build and submit to TestFlight
        run: npx eas-cli build --platform ios --profile production --auto-submit --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
